services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=App;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      # Single instance, so migrating on startup is safe here. With several replicas, run
      # migrations as a separate release step instead.
      Database__MigrateOnStartup: "true"
      # Required outside Development: at least 32 characters, never the checked-in placeholder.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY (32+ characters) in the environment or an .env file}"
      # Optional: raises GitHub's limit from 60 to 5,000 requests/hour.
      GitHub__Token: "${GITHUB_TOKEN:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: App
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d App"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
