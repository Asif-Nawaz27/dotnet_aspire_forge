name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Feature/App.Api --configuration Release

      - name: Unit tests
        run: dotnet test Tests/App.UnitTests --configuration Release

      - name: Integration tests
        run: dotnet test Tests/App.Api.IntegrationTests --configuration Release

      - name: Docker image
        run: docker build -t app-api .
