name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ProductionApi.sln

      - name: Build
        run: dotnet build ProductionApi.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ProductionApi.sln --no-build --configuration Release