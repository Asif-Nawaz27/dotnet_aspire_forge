name: CI

on:
  push:
    branches: [main]
  # Tests run before a merge, not only after it lands on main.
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

# A new push to a pull request cancels its earlier, now outdated run. Runs on main and releases
# always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test Tests/AspireForge.Core.Tests --no-restore --no-build --configuration Release
          dotnet test Tests/AspireForge.Analyzers.Tests --no-restore --no-build --configuration Release
          dotnet test Tests/AspireForge.Cli.Tests --no-restore --no-build --configuration Release

      - name: Integration tests
        run: |
          dotnet test Tests/AspireForge.Generators.Tests --no-restore --no-build --configuration Release
          dotnet test Tests/AspireForge.IntegrationTests --no-restore --no-build --configuration Release

      - name: Sample app tests
        run: |
          dotnet test App/Tests/App.UnitTests --no-restore --no-build --configuration Release
          dotnet test App/Tests/App.Api.IntegrationTests --no-restore --no-build --configuration Release

      # AspireForge checks its own sample app, with the tool built from this commit rather than a
      # published release, so a rule change that breaks on a real project fails here first. The
      # summary runs first and can't fail, so the report is on the run's summary page even when the
      # gate below fails.
      - name: Doctor summary (sample app)
        run: dotnet Feature/AspireForge.Cli/bin/Release/net10.0/aspireforge.dll doctor App/Feature/App.Api --format markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Doctor (sample app)
        run: dotnet Feature/AspireForge.Cli/bin/Release/net10.0/aspireforge.dll doctor App/Feature/App.Api

      - name: Pack
        run: dotnet pack Feature/AspireForge.Cli --no-restore --no-build --configuration Release --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspireforge-cli-package
          path: ./artifacts/*.nupkg

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack Feature/AspireForge.Cli --configuration Release --output ./artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
