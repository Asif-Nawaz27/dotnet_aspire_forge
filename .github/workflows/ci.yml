name: CI

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test Tests/AspireForge.Core.Tests --no-restore --no-build --configuration Release
          dotnet test Tests/AspireForge.Analyzers.Tests --no-restore --no-build --configuration Release
          dotnet test Tests/AspireForge.Cli.Tests --no-restore --no-build --configuration Release

      - name: Integration tests
        run: |
          dotnet test Tests/AspireForge.Generators.Tests --no-restore --no-build --configuration Release
          dotnet test Tests/AspireForge.IntegrationTests --no-restore --no-build --configuration Release

      - name: Pack
        run: dotnet pack Feature/AspireForge.Cli --no-restore --no-build --configuration Release --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspireforge-cli-package
          path: ./artifacts/*.nupkg

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack Feature/AspireForge.Cli --configuration Release --output ./artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
